name: Windows build

# Builds Project Browser on a GitHub-hosted Windows machine and publishes the
# installer as a downloadable artifact. Use this when the local machine cannot
# run Cargo build scripts (e.g. Smart App Control).
#
#   * Push to main/master or open a PR: build + test, upload the installer.
#   * Actions tab -> "Windows build" -> Run workflow: same, on demand.
#   * Releases are NOT made here: pushing a v* tag runs the Release workflow (release.yml).
#
# What a green run proves: the frontend checks pass, the Rust code compiles, the Rust unit tests
# pass, and an NSIS installer was produced. It does NOT prove that WebView2 renders pages in a
# real desktop window: that needs a person following docs/VERIFY-WINDOWS.md on a Windows PC.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Frontend checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        run: npm test
      - name: Production build
        run: npm run build

  installer:
    name: Rust checks, tests and installer
    runs-on: windows-latest
    needs: web
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Toolchain versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          node --version
          # The WebView2 runtime the runner has (informational).
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv

      - run: npm ci

      # The frontend must exist before the Tauri crate is compiled (generate_context! embeds it).
      - name: Build frontend
        run: npm run build

      # Formatting is enforced: the tree is formatted with src-tauri/rustfmt.toml.
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # First real compile of the native code. A failure here is a genuine compiler error.
      - name: Rust unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath rust-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Exercises the real Windows Credential Manager and DPAPI (need a user session; informational).
      - name: Credential Manager and DPAPI round-trips (informational)
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml secrets -- --ignored
          $a = $LASTEXITCODE
          cargo test --locked --manifest-path src-tauri/Cargo.toml vault -- --ignored
          $b = $LASTEXITCODE
          if ($a -ne 0 -or $b -ne 0) { exit 1 }
        continue-on-error: true

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Test builds do not make the signed updater package (that needs the private key, which only the Release
      # workflow has). The installer itself is identical.
      - name: Build Windows installer
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      # Launches the real exe on the runner against a throwaway data folder and checks it survives the first
      # process-memory sample (the step that crashed 0.1.0), logged the startup stages and left no crash event.
      # Shown to work on hosted runners (the app starts and WebView2 runs), so a failure here blocks.
      - name: Startup smoke test
        shell: pwsh
        run: ./scripts/smoke-startup.ps1 -Exe src-tauri/target/release/project-browser.exe -Seconds 30 -ReportDir smoke-report

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-smoke-report
          path: smoke-report
          if-no-files-found: ignore
          retention-days: 14

      # Installs the built installer on the runner, checks the default-browser registration it writes (ProgIDs,
      # StartMenuInternet, Capabilities, RegisteredApplications), opens links through the registered commands (first
      # launch, a second link forwarded to the running browser, a local .html file), then uninstalls and checks cleanup.
      - name: Default-browser registration and link opening
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./scripts/verify-registration.ps1 -Installer $setup.FullName -ReportDir registration-report

      - name: Upload registration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-report
          path: registration-report
          if-no-files-found: ignore
          retention-days: 14

      # Real mouse and keyboard input on the runner's desktop: loads a page, right-clicks it, tears a tab off into a
      # new window, and captures the browser's own windows. Informational until it has proven stable on runners.
      - name: Native UI probe (informational)
        shell: pwsh
        continue-on-error: true
        run: ./scripts/ui-probe.ps1 -Exe src-tauri/target/release/project-browser.exe -ReportDir ui-probe

      - name: Upload UI probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-probe
          path: ui-probe
          if-no-files-found: ignore
          retention-days: 14

      # Real downloads through the real executable from a local fixture server, checked on disk by size and SHA-256
      # (plain, Content-Disposition, Unicode, redirect, large, .exe, duplicates, blob, cookie session, 404, cut-off),
      # plus the download history before and after a restart. Three configurations isolate Gaming Mode and the Shield.
      - name: Download probe (default settings)
        shell: pwsh
        run: ./scripts/download-probe.ps1 -Exe src-tauri/target/release/project-browser.exe -Config default -ReportDir download-probe

      - name: Download probe (Gaming Mode, Windows Downloads folder)
        if: always()
        shell: pwsh
        run: ./scripts/download-probe.ps1 -Exe src-tauri/target/release/project-browser.exe -Config gaming -ReportDir download-probe

      - name: Download probe (Shield off)
        if: always()
        shell: pwsh
        run: ./scripts/download-probe.ps1 -Exe src-tauri/target/release/project-browser.exe -Config noshield -ReportDir download-probe

      - name: Upload download probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-probe
          path: download-probe
          if-no-files-found: ignore
          retention-days: 14

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, Length

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '### Windows build',
            '',
            'A green run means: frontend checks passed, Rust compiled, Rust unit tests passed, installer built.',
            '',
            '**It does not mean web pages render.** WebView2 rendering, navigation, tabs, downloads and the importer against',
            'real browser profiles still have to be checked on a Windows PC: see `docs/VERIFY-WINDOWS.md`.'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: project-browser-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # The bare executable, handy for a quick look without installing. It still needs the
      # WebView2 runtime (present on Windows 11).
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: project-browser-portable-exe
          path: src-tauri/target/release/project-browser.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-log
          path: rust-test.log
          if-no-files-found: ignore
          retention-days: 7

  # Measurements on the hosted runner (2-4 vCPUs, shared hardware): useful to compare builds and browsers run the same
  # way on the same kind of machine, not as absolute numbers for a desktop PC. Informational: never blocks a build.
  benchmark:
    name: Benchmarks (informational)
    runs-on: windows-latest
    needs: installer
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: project-browser-portable-exe
          path: pb
      - name: Startup (cold and warm)
        shell: pwsh
        run: ./scripts/startup-bench.ps1 -Exe pb/project-browser.exe -Runs 3 -Out bench-results
      - name: Memory and CPU with 1, 5, 10 and 20 tabs (Project Browser)
        shell: pwsh
        run: ./scripts/benchmark.ps1 -Browser project-browser -Exe pb/project-browser.exe -Tabs 1,5,10,20 -LoadWait 25 -Settle 10 -Idle 30 -Out bench-results
      - name: Same pages in Google Chrome (the runner's copy)
        shell: pwsh
        run: ./scripts/benchmark.ps1 -Browser chrome -Exe "C:\Program Files\Google\Chrome\Application\chrome.exe" -Tabs 1,5,10,20 -LoadWait 25 -Settle 10 -Idle 30 -Out bench-results
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results
          if-no-files-found: ignore
          retention-days: 30
