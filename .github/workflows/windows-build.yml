name: Windows build

# Builds Project Browser on a GitHub-hosted Windows machine and publishes the
# installer as a downloadable artifact. Use this when the local machine cannot
# run Cargo build scripts (e.g. Smart App Control).
#
#   * Push to main/master or open a PR: build + test, upload the installer.
#   * Actions tab -> "Windows build" -> Run workflow: same, on demand.
#   * Push a tag like v0.1.0: also attaches the installer to a GitHub Release.
#
# What a green run proves: the frontend checks pass, the Rust code compiles, the Rust unit tests
# pass, and an NSIS installer was produced. It does NOT prove that WebView2 renders pages in a
# real desktop window: that needs a person following docs/VERIFY-WINDOWS.md on a Windows PC.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Frontend checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        run: npm test
      - name: Production build
        run: npm run build

  installer:
    name: Rust checks, tests and installer
    runs-on: windows-latest
    needs: web
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Toolchain versions
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          node --version
          # The WebView2 runtime the runner has (informational).
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv

      - run: npm ci

      # The frontend must exist before the Tauri crate is compiled (generate_context! embeds it).
      - name: Build frontend
        run: npm run build

      # Formatting is enforced: the tree is formatted with src-tauri/rustfmt.toml.
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # First real compile of the native code. A failure here is a genuine compiler error.
      - name: Rust unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath rust-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Exercises the real Windows Credential Manager (needs a user session; informational).
      - name: Credential Manager round-trip (informational)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml secrets -- --ignored
        continue-on-error: true

      # Lint warnings are reported but do not block the installer yet: the code has never been
      # linted. Once this step is clean, remove continue-on-error and add `-- -D warnings`.
      - name: Clippy (informational)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets
        continue-on-error: true

      # Test builds do not make the signed updater package (that needs the private key, which only the Release
      # workflow has). The installer itself is identical.
      - name: Build Windows installer
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      # Launches the real exe on the runner against a throwaway data folder and checks it survives the first
      # process-memory sample (the step that crashed 0.1.0), logged the startup stages and left no crash event.
      # Hosted runners may not be able to draw WebView2: until that is shown to work this reports but does not block.
      - name: Startup smoke test (informational until proven on hosted runners)
        shell: pwsh
        run: ./scripts/smoke-startup.ps1 -Exe src-tauri/target/release/project-browser.exe -Seconds 30 -ReportDir smoke-report
        continue-on-error: true

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-smoke-report
          path: smoke-report
          if-no-files-found: ignore
          retention-days: 14

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, Length

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '### Windows build',
            '',
            'A green run means: frontend checks passed, Rust compiled, Rust unit tests passed, installer built.',
            '',
            '**It does not mean web pages render.** WebView2 rendering, navigation, tabs, downloads and the importer against',
            'real browser profiles still have to be checked on a Windows PC: see `docs/VERIFY-WINDOWS.md`.'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: project-browser-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # The bare executable, handy for a quick look without installing. It still needs the
      # WebView2 runtime (present on Windows 11).
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: project-browser-portable-exe
          path: src-tauri/target/release/project-browser.exe
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-log
          path: rust-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # Releases need write access to contents.
    permissions:
      contents: write
